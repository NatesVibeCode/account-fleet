name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run test suite
      run: |
        pytest -v

    - name: Golden run — bundled examples via deterministic demo provider (no API keys)
      run: |
        python -m pip install -e ".[dev]"
        free-fleet validate examples/saas_intelligence/task.json --input examples/saas_intelligence/sample_data.jsonl --json
        free-fleet validate examples/security_cve_triage/task.json --input examples/security_cve_triage/sample_data.jsonl --json
        rm -rf runs/demo free-fleet.db
        free-fleet quickstart --demo --run-id demo --json
        test -f runs/demo/clean_packet.json
        test -f runs/demo/clean_packet.csv
        free-fleet export demo --format csv --output /tmp/demo.csv
        free-fleet export demo --format jsonl --output /tmp/demo.jsonl
        free-fleet export demo --format json --output /tmp/demo.json
        free-fleet status demo --json
        echo "Golden run verified"

    - name: Verify installed wheel bootstrap
      run: |
        python -m pip wheel . --no-deps --wheel-dir dist
        python -m pip install --force-reinstall --no-deps dist/*.whl
        mkdir -p "$RUNNER_TEMP/free-fleet-workspace"
        cd "$RUNNER_TEMP/free-fleet-workspace"
        free-fleet setup --scope project --workspace-root "$PWD" --json
        test -f .agents/skills/free-fleet/SKILL.md
        test -f free-fleet.db
