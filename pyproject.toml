[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-lanes"
version = "0.1.0"
description = "Universal air-gapped bulk model lane orchestrator for any harness (OpenCode + OpenRouter)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bulk-lanes contributors" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/bulk-lanes/bulk-lanes"
Repository = "https://github.com/bulk-lanes/bulk-lanes"
Issues = "https://github.com/bulk-lanes/bulk-lanes/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
bulk-lanes = "bulk_lanes.cli:main"

[tool.setuptools.packages.find]
include = ["bulk_lanes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
