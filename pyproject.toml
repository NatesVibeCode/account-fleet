[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-lanes"
version = "0.1.0"
description = "Air-gapped bulk inference orchestrator for OpenCode and OpenRouter lanes with grounded verification."
readme = "README.md"
authors = [{ name = "Nate" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
bulk-lanes = "bulk_lanes.cli:main"

[tool.setuptools.packages.find]
include = ["bulk_lanes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
